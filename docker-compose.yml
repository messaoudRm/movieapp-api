
services:
  prometheus:
    image: prom/prometheus:v2.44.0
    container_name: movieapp-prometheus
    ports:
      - "9090:9090"
    depends_on:
      - app
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:9.5.2
    container_name: movieapp-grafana
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - grafana-data:/var/lib/grafana

  db:
    image: mariadb:11.8.2
    container_name: movieapp-db
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: DB
      MARIADB_ALLOW_LOCAL_INFILE: 1
    ports:
      - "3308:3306"
    volumes:
      - ./init:/docker-entrypoint-initdb.d
      - maria-db-data:/var/lib/mysql

  adminer:
    image: adminer
    container_name: movieapp-adminer
    restart: always
    ports:
      - "8082:8080"

  app:
    build: .
    container_name: movieapp-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://db:3306/DB
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    depends_on:
      - db

volumes:
  maria-db-data:
  prometheus-data:
  grafana-data:
