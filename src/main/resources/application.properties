spring.application.name=MovieApp-API

# URL de connexion � la base de donn�es MariaDB
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Garde les noms de tables/colonnes tels quels
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Contexte de l'application
server.servlet.context-path=/api

# Cle secrete et temps d'expiration du JWT
jwt.secretKey=Jn4zy7olrHc8idI326thW5wDaxn8phYKx1czQFx64cA=
jwt.expirationTime=3600000

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui

# Logging
logging.level.root=INFO
logging.file.name=/app/logs/api.log

# Prometheus
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Kafka
spring.kafka.bootstrap-servers=kafka:9092

# PRODUCER
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# CONSUMER
spring.kafka.consumer.group-id=movieapp-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# JSON config :
spring.kafka.consumer.properties.spring.json.trusted.packages=mess.tech.movieapp.*
spring.kafka.consumer.properties.spring.json.value.default.type=mess.tech.movieapp.dto.SentimentEvent
